<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hedera Ecosystem Map</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #000000;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Common Search Bar Styles */
    .search-bar {
      display: flex;
      align-items: center;
      background: #000000;
      border: 2px solid #7b59eb;
      border-radius: 50px;
      padding: 8px 8px 8px 20px;
      width: 280px;
      position: relative;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      min-width: 0;
    }

    .search-input::placeholder {
      color: #888888;
    }

    .search-button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #7b59eb;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .search-button:hover {
      background: #7c3aed;
    }

    .search-button svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    /* Desktop Search Bar Overrides */
    @media (min-width: 769px) {
      .search-bar {
        border: 1px solid #666666;
        padding: 4px 4px 4px 16px;
        width: 220px;
      }

      .search-button {
        width: 24px;
        height: 24px;
        background: #000000;
        border: 1px solid #666666;
      }

      .search-button:hover {
        background: #1a1a1a;
      }

      .search-button svg {
        width: 12px;
        height: 12px;
        fill: #888888;
      }

      .search-input {
        font-size: 12px;
      }

      .search-result {
        font-size: 11px;
        right: 32px;
        left: 16px;
      }
    }

    .search-result {
      position: absolute;
      left: 16px;
      right: 44px;
      color: #10b981;
      font-size: 12px;
      font-weight: 500;
      display: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
      top: 50%;
      transform: translateY(-50%);
    }

    .search-result.not-found {
      color: #ef4444;
    }

    .search-result.visible {
      display: block;
    }

    .search-result.visible + .search-input {
      visibility: hidden;
    }

    /* Pulse Animation for found logos - scale only, no glow */
    @keyframes logo-pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }

    .logo-pulsing {
      animation: logo-pulse 0.8s ease-in-out infinite;
      z-index: 100;
      transform-box: fill-box;
      transform-origin: center center;
    }

    /* SVG image pulse - needs transform-box to pulse in place */
    svg image.logo-pulsing {
      animation: logo-pulse 0.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center center;
    }

    /* Footer logo pulse */
    .mobile-footer img.logo-pulsing {
      animation: logo-pulse 0.8s ease-in-out infinite;
    }

    /* Desktop styles */
    @media (min-width: 769px) {
      html, body {
        overflow: hidden;
      }

      .map-container {
        width: 100vw;
        height: 100vh;
        padding: 20px 25px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .map-container svg {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .mobile-container {
        display: none !important;
      }

      /* Desktop Search Bar - positioned dynamically via JS */
      .desktop-search-container {
        position: absolute;
        z-index: 1000;
        pointer-events: auto;
      }

      .desktop-search-container .search-bar {
        border: 1px solid #666666;
        padding: 4px 4px 4px 12px;
        background: #000000;
      }

      .desktop-search-container .search-button {
        width: 20px;
        height: 20px;
        background: #000000;
        border: 1px solid #666666;
      }

      .desktop-search-container .search-button svg {
        width: 10px;
        height: 10px;
        fill: #888888;
      }

      .desktop-search-container .search-input {
        font-size: 11px;
      }

      .desktop-search-container .search-result {
        font-size: 10px;
        right: 28px;
        left: 12px;
      }
    }

    /* Mobile styles */
    @media (max-width: 768px) {
      html, body {
        overflow-x: hidden;
        overflow-y: auto;
        height: auto;
      }

      .map-container {
        display: none !important;
      }

      .modal-overlay {
        display: none !important;
      }

      .desktop-search-container {
        display: none !important;
      }

      .top-link {
        position: relative !important;
        display: block;
        text-align: center;
        padding: 12px;
        top: auto !important;
        right: auto !important;
        border-bottom: 1px solid rgba(139, 92, 246, 0.3);
      }

      .mobile-container {
        display: block;
        padding: 16px;
        padding-bottom: 40px;
      }

      .mobile-header {
        text-align: center;
        padding: 20px 0 24px;
        border-bottom: 1px solid rgba(139, 92, 246, 0.3);
        margin-bottom: 20px;
      }

      .mobile-header h1 {
        color: #ffffff;
        font-size: 30px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .mobile-header p {
        color: #ffffff;
        font-size: 12px;
      }

      /* Mobile Search Container */
      .search-container {
        display: flex;
        justify-content: center;
        margin-top: 16px;
      }

      /* Mobile Search Bar Styling */
      .search-bar {
        border: 1px solid #666666;
      }

      /* Prevent zoom on input focus - must be 16px or larger */
      .search-input {
        font-size: 16px;
      }

      .search-button {
        background: #000000;
        border: 1px solid #666666;
      }

      .search-button:hover {
        background: #1a1a1a;
      }

      .search-button svg {
        fill: #888888;
      }

      /* Mobile logo pulse */
      .mobile-logo.logo-pulsing .mobile-logo-img {
        animation: logo-pulse 1s ease-in-out infinite;
      }

      .mobile-section {
        background: rgba(139, 92, 246, 0.05);
        border: 1px solid #7b59eb;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        overflow: hidden;
        box-sizing: border-box;
      }

      .mobile-section-title {
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(139, 92, 246, 0.2);
      }

      .mobile-logos {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        width: 100%;
        box-sizing: border-box;
      }

      .mobile-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        padding: 4px;
        min-width: 0;
        overflow: hidden;
      }

      .mobile-logo-img {
        width: 48px;
        max-width: 100%;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        border: 1.5px solid #7b59eb;
        background: rgba(0, 0, 0, 0.6);
        margin-bottom: 6px;
        flex-shrink: 0;
      }

      .mobile-logo-placeholder {
        width: 48px;
        max-width: 100%;
        height: 48px;
        border-radius: 50%;
        border: 1.5px solid #7b59eb;
        background: rgba(0, 0, 0, 0.6);
        margin-bottom: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 14px;
        color: #7b59eb;
        font-weight: 600;
      }

      .mobile-logo-name {
        color: #ffffff;
        font-size: 9px;
        font-weight: 500;
        text-align: center;
        line-height: 1.2;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      /* Council section - 3 logos per row, no text labels, evenly spaced */
      .mobile-section.council .mobile-logos {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        align-items: center;
        justify-items: center;
      }

      .mobile-section.council .mobile-logo {
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 45px;
        width: 100%;
      }

      .mobile-section.council .mobile-logo-img {
        width: auto !important;
        max-width: 100%;
        max-height: 65px;
        border-radius: 4px;
        object-fit: contain;
        background: transparent;
        border: none;
        margin-bottom: 0;
      }

      .mobile-section.council .mobile-logo-placeholder {
        width: 80px;
        height: 35px;
        border-radius: 4px;
        font-size: 12px;
        margin-bottom: 0;
      }

      .mobile-section.council .mobile-logo-name {
        display: none;
      }

      /* Council partners (wide wordmarks) - 2 logos per row */
      .mobile-section.council.partners .mobile-logos {
        grid-template-columns: repeat(2, 1fr);
      }

      /* Core orgs - 3 logos per row, no text labels, vertically centered */
      .mobile-section.core-orgs .mobile-logos {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        align-items: center;
      }

      .mobile-section.core-orgs .mobile-logo {
        padding: 8px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 90px;
      }

      .mobile-section.core-orgs .mobile-logo-img {
        width: auto !important;
        max-width: 100%;
        border-radius: 4px;
        object-fit: contain;
        background: transparent;
        border: none;
        margin-bottom: 0;
      }

      .mobile-section.core-orgs .mobile-logo-placeholder {
        width: 100%;
        height: 30px;
        border-radius: 4px;
        font-size: 10px;
        margin-bottom: 0;
      }

      .mobile-section.core-orgs .mobile-logo-name {
        display: none;
      }

      /* Native services - text based */
      .mobile-section.native-services .mobile-logos {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .mobile-native-service {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        padding: 12px 8px;
        background: rgba(139, 92, 246, 0.1);
        border-radius: 8px;
      }

      .mobile-native-abbrev {
        color: #7b59eb;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .mobile-native-name {
        color: #ffffff;
        font-size: 10px;
        font-weight: 500;
        text-align: center;
        line-height: 1.3;
      }

      .mobile-footer {
        text-align: center;
        padding: 20px;
        color: #c4b5fd;
        font-size: 11px;
        border-top: 1px solid rgba(139, 92, 246, 0.3);
        margin-top: 20px;
      }

      .mobile-footer a {
        color: #7b59eb;
        text-decoration: none;
      }
    }

    /* Shared styles */
    .top-link {
      position: fixed;
      top: 5px; /* Moved up to increase space from search bar below */
      right: 55px;
      color: #ffffff;
      text-decoration: none;
      font-size: 12px; /* Reduced 15% from 14px */
      font-weight: 500;
      z-index: 100;
      transition: color 0.2s ease;
    }

    .top-link:hover {
      color: #7b59eb;
    }

    /* Modal styles (desktop only) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-wrapper {
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 10px;
    }

    .modal-content {
      background: #0a0a0f;
      border: 1px solid #7b59eb;
      border-radius: 16px;
      padding: 30px;
      max-width: 85vw;
      max-height: 85vh;
      overflow: auto;
      position: relative;
      box-shadow: 0 25px 60px rgba(139, 92, 246, 0.3);
    }

    .modal-close {
      background: #0a0a0f;
      border: 1px solid #7b59eb;
      color: #7b59eb;
      font-size: 24px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .modal-close:hover {
      background: #7b59eb;
      color: #ffffff;
    }

    .modal-header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(139, 92, 246, 0.3);
      padding-bottom: 16px;
    }

    .modal-title {
      color: #7b59eb;
      font-size: 24px;
      font-weight: 700;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 24px;
    }

    .modal-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      padding: 16px;
      border-radius: 12px;
      background: rgba(139, 92, 246, 0.05);
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .modal-item:hover {
      background: rgba(139, 92, 246, 0.15);
      border-color: #7b59eb;
      transform: translateY(-2px);
    }

    .modal-item-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: none;
      background: rgba(0, 0, 0, 0.6);
      margin-bottom: 12px;
    }

    .modal-item-name {
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      line-height: 1.3;
    }

    /* Council section modal - 3 logos per row */
    .modal-grid.council {
      grid-template-columns: repeat(3, 1fr);
    }

    .council .modal-item-logo {
      width: 140px;
      height: 80px;
      border-radius: 8px;
      object-fit: contain;
      padding: 10px;
      background: transparent;
      transition: filter 0.2s ease;
    }

    .council .modal-item:hover .modal-item-logo {
      filter: brightness(0.5) sepia(1) hue-rotate(220deg) saturate(5);
    }

    /* Core orgs modal - single column layout for large logos */
    .modal-grid.core-orgs {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .core-orgs .modal-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      padding: 30px;
      min-height: 200px;
    }

    .core-orgs .modal-item-logo {
      width: 180px;
      height: 60px;
      border-radius: 8px;
      object-fit: contain;
      background: transparent;
      border: none;
      transition: filter 0.2s ease;
    }

    /* Larger logos for specific core orgs */
    .core-orgs .modal-item-logo.logo-3x {
      width: 480px;
      height: 160px;
    }

    .core-orgs .modal-item-logo.logo-foundation {
      width: 600px;
      height: 200px;
    }

    .core-orgs .modal-item-name {
      margin-top: 20px;
      font-size: 14px;
    }

    .core-orgs .modal-item:hover .modal-item-logo {
      filter: invert(48%) sepia(79%) saturate(2476%) hue-rotate(230deg) brightness(95%) contrast(95%);
    }
  </style>
</head>
<body>
  <a href="https://dashboard.hederamap.com" target="_blank" rel="noopener noreferrer" class="top-link">Hedera Data Dashboard →</a>

  <!-- Desktop Search Bar (positioned dynamically via JavaScript) -->
  <div class="desktop-search-container" id="desktop-search-container">
    <div class="search-bar" id="desktop-search-bar">
      <input type="text" class="search-input" id="desktop-search-input" placeholder="Search for an entity..." spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" data-form-type="other">
      <span class="search-result" id="desktop-search-result"></span>
      <button class="search-button" id="desktop-search-button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </div>

  <!-- Desktop SVG Map -->
  <div class="map-container" id="map-container">
    SVG_CONTENT_PLACEHOLDER
  </div>

  <!-- Mobile Layout -->
  <div class="mobile-container" id="mobile-container">
    <div class="mobile-header">
      <h1><a href="https://hedera.com" target="_blank" rel="noopener noreferrer" style="color: #ffffff; text-decoration: none;">Hedera</a> Ecosystem Map</h1>
      <p>An Incomplete Map of the Hedera Ecosystem</p>
      <!-- Mobile Search Bar -->
      <div class="search-container">
        <div class="search-bar">
          <input type="text" class="search-input" id="mobile-search-input" placeholder="Search for an entity..." spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" data-form-type="other">
          <span class="search-result" id="mobile-search-result"></span>
          <button class="search-button" id="mobile-search-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>
      </div>
    </div>
    MOBILE_SECTIONS_PLACEHOLDER
    <div class="mobile-footer">
      <p>Data updates regularly. The list of projects is not comprehensive.</p>
      <p style="margin-top: 8px;">Built by <a href="https://genfinity.io" target="_blank" rel="noopener noreferrer"><img src="GENFINITY_LOGO_PLACEHOLDER" alt="Genfinity" style="height: 18px; vertical-align: middle;"></a></p>
    </div>
  </div>

  <!-- Desktop Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-wrapper">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-title">Section</h2>
        </div>
        <div class="modal-grid" id="modal-grid">
          <!-- Items will be populated here -->
        </div>
      </div>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
  </div>

  <script>
    // Section data from the CSV (will be populated by the build script)
    const sectionData = SECTION_DATA_PLACEHOLDER;

    // Check if mobile
    const isMobile = () => window.innerWidth <= 768;

    // ----- Hover layout -----
    // Hovering a section (after a short delay) zooms it: its box and logos grow to its data-hover-scale (the
    // Hedera Council switches to its larger 3-column layout instead). The other boxes never sit under it:
    // its row and column neighbors narrow or shorten to make room, every box reflows its logos to its new
    // shape, and the boxes always tile the same outer rectangle. The hovered box always contains its resting
    // box, so the pointer that opened it stays inside it while everything moves.
    const HOVER_DELAY = 120;    // ms before a section opens (hover intent)
    const LEAVE_DELAY = 200;    // ms before the map settles back after the pointer leaves the boxes
    const MOVE_MS = 300;        // expand / collapse animation
    const reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    const hoverMap = { boxes: new Map(), hot: null, layout: null, pending: null, anim: null, struct: null, svg: null };

    const numList = (s) => (s || '').split(',').map(Number);

    function initHoverLayout() {
      const svg = document.querySelector('.map-container svg');
      if (!svg || !svg.getAttribute('data-layout')) return;
      hoverMap.svg = svg;
      hoverMap.struct = JSON.parse(svg.getAttribute('data-layout'));
      svg.querySelectorAll('.section-group').forEach(group => {
        const name = group.getAttribute('data-section');
        const [x, y, w, h] = numList(group.getAttribute('data-box'));
        const isCouncil = group.classList.contains('council-section');
        const layer = isCouncil ? group.querySelector('.council-normal') : group;
        const panel = isCouncil ? layer.querySelector('.panel') : group.querySelector(':scope > .panel');
        const cellOwner = isCouncil ? layer : group;
        const [bw, bh] = numList(cellOwner.getAttribute('data-cell') || '44,56');
        const items = [...layer.querySelectorAll('.map-item')].map(el => ({
          el, ox: +el.getAttribute('data-cx'), oy: +el.getAttribute('data-cy'), cur: { a: 0, b: 0, k: 1 }
        }));
        const title = group.querySelector(':scope > .section-title');
        const tx = title ? +title.getAttribute('x') : x, ty = title ? +title.getAttribute('y') : y;
        let titleW = 0;
        try { titleW = title ? title.getBBox().width : 0; } catch (e) { titleW = 0; }
        hoverMap.boxes.set(name, {
          name, group, isCouncil, panel, items, title, tx, ty, titleW,
          rest: { x, y, w, h }, cur: { x, y, w, h },
          titleCur: { a: 0, b: 0, k: 1 },
          scale: parseFloat(group.getAttribute('data-hover-scale')) || 1.8,
          hoverBox: isCouncil ? numList(group.getAttribute('data-hover-box')) : null,
          cell: { w: bw, h: bh },
          restCols: +(group.getAttribute('data-cols') || 0),
          alignTop: group.getAttribute('data-align') === 'top',
          hoverLayer: isCouncil ? group.querySelector('.council-hover') : null,
          normalLayer: isCouncil ? layer : null,
        });
      });

      svg.addEventListener('mousemove', onMapPointer);
      svg.addEventListener('mouseleave', () => schedule(null, LEAVE_DELAY));
    }

    // Where every box goes when `hot` is expanded (rest positions when hot is null)
    function computeLayout(hot) {
      const S = hoverMap.struct, B = hoverMap.boxes, out = new Map();
      for (const [n, b] of B) out.set(n, { ...b.rest });
      if (!hot || !B.has(hot)) return out;
      const hb = B.get(hot);
      const gap = S.gap, rowGap = S.rowGap;
      const council = B.get(S.council);
      const sideRest = B.get(S.side[0]).rest;
      const Lw = sideRest.x - gap - council.rest.w - gap - S.x;   // left area width at rest
      const Cw = council.rest.w, Sw = sideRest.w;
      const inner = S.w - 2 * gap;                                // Lw + Cw + Sw
      const rowIdx = S.rows.findIndex(r => r.includes(hot));
      const inSide = S.side.includes(hot);
      const isCouncil = hot === S.council;
      let tw, th;
      if (isCouncil) { tw = hb.hoverBox[2]; th = hb.hoverBox[3]; }
      else { tw = hb.rest.w * hb.scale; th = hb.rest.h * hb.scale; }

      // 1. column widths: left area, council, side column
      let L = Lw, C = Cw, Sd = Sw;
      if (rowIdx >= 0) {
        const row = S.rows[rowIdx];
        const others = row.filter(n => n !== hot).reduce((t, n) => t + B.get(n).rest.w, 0);
        const gapsRow = gap * (row.length - 1);
        if (others > 0) {
          // grow the left area just enough that the row's other boxes and the right columns shrink alike
          const R = Cw + Sd;
          const balanced = (inner / R + (tw + gapsRow) / others) / (1 / others + 1 / R);
          L = Math.max(Lw, Math.min(balanced, inner - 120));
        } else L = Math.max(Lw, tw);
        const f = (inner - L) / (Cw + Sw);
        C = Cw * f; Sd = Sw * f;
      } else if (isCouncil) {
        C = tw;
        const f = (inner - tw) / (Lw + Sw);
        L = Lw * f; Sd = Sw * f;
      } else if (inSide) {
        Sd = Math.min(tw, inner - 240);
        const f = (inner - Sd) / (Lw + Cw);
        L = Lw * f; C = Cw * f;
      }
      const Lx = S.x, Cx = S.x + L + gap, Sx = Cx + C + gap;

      // 2. left area rows
      const nRows = S.rows.length;
      const rowsH = S.h - rowGap * (nRows - 1);
      const restRowH = S.rows.map(r => B.get(r[0]).rest.h);
      const restSum = restRowH.reduce((t, v) => t + v, 0);
      let rowH;
      if (rowIdx >= 0) {
        const hotH = Math.min(th, rowsH - 48 * (nRows - 1));
        const rest = restSum - restRowH[rowIdx];
        rowH = restRowH.map((v, i) => i === rowIdx ? hotH : (rowsH - hotH) * v / rest);
      } else rowH = restRowH.map(v => v * rowsH / restSum);
      let y = S.y;
      S.rows.forEach((row, i) => {
        const gapsRow = gap * (row.length - 1);
        let widths;
        if (i === rowIdx) {
          const others = row.filter(n => n !== hot).reduce((t, n) => t + B.get(n).rest.w, 0);
          const avail = L - gapsRow - tw;
          widths = row.map(n => n === hot ? tw : B.get(n).rest.w * avail / others);
        } else {
          const restW = row.reduce((t, n) => t + B.get(n).rest.w, 0);
          widths = row.map(n => B.get(n).rest.w * (L - gapsRow) / restW);
        }
        let x = Lx;
        row.forEach((n, j) => { out.set(n, { x, y, w: widths[j], h: rowH[i] }); x += widths[j] + gap; });
        y += rowH[i] + rowGap;
      });

      // 3. council column (the expanded council uses its own drawn box)
      out.set(S.council, isCouncil
        ? { x: hb.hoverBox[0], y: hb.hoverBox[1], w: hb.hoverBox[2], h: hb.hoverBox[3] }
        : { x: Cx, y: S.y, w: C, h: S.h });

      // 4. side column
      const sideH = S.h - rowGap * (S.side.length - 1);
      const sideRestH = S.side.map(n => B.get(n).rest.h);
      let sh;
      if (inSide) {
        const k = S.side.indexOf(hot);
        const hotH = Math.min(th, sideH - 48 * (S.side.length - 1));
        const rest = sideRestH.reduce((t, v, i) => i === k ? t : t + v, 0);
        sh = sideRestH.map((v, i) => i === k ? hotH : (sideH - hotH) * v / rest);
      } else sh = sideRestH;
      y = S.y;
      S.side.forEach((n, i) => { out.set(n, { x: Sx, y, w: Sd, h: sh[i] }); y += sh[i] + rowGap; });
      return out;
    }

    // Item transforms for a box drawn at `r`: the hovered box scales its resting arrangement; any other box
    // lays its logos out again in the grid that keeps them largest (never above their resting size)
    function placeItems(b, r, hot) {
      const n = b.items.length;
      if (!n) return [];
      const same = Math.abs(r.x - b.rest.x) < 0.01 && Math.abs(r.y - b.rest.y) < 0.01 && Math.abs(r.w - b.rest.w) < 0.01 && Math.abs(r.h - b.rest.h) < 0.01;
      if (same) return b.items.map(() => ({ a: 0, b: 0, k: 1 }));
      if (hot) {
        const s = Math.min(r.w / b.rest.w, r.h / b.rest.h);
        return b.items.map(it => {
          const nx = r.x + (it.ox - b.rest.x) * s, ny = r.y + (it.oy - b.rest.y) * s;
          return { a: nx - s * it.ox, b: ny - s * it.oy, k: s };
        });
      }
      const pad = 6, aw = Math.max(1, r.w - 2 * pad), ah = Math.max(1, r.h - 2 * pad);
      const { w: cw, h: ch } = b.cell;
      let best = null;
      for (let c = 1; c <= n; c++) {
        const rows = Math.ceil(n / c);
        const k = Math.min(1, aw / (c * cw), ah / (rows * ch));
        const pref = b.restCols ? Math.abs(c - b.restCols) : Math.abs(Math.log((aw / c) / (ah / rows)) - Math.log(cw / ch));
        if (!best || k > best.k + 1e-6 || (Math.abs(k - best.k) <= 1e-6 && pref < best.pref)) best = { c, rows, k, pref };
      }
      const { c, rows, k } = best;
      const cellW = aw / c;
      const pitch = Math.min(ah / rows, ch * k + (b.alignTop ? 15 * k : ah));
      const top = b.alignTop ? r.y + pad : r.y + pad + (ah - pitch * rows) / 2;
      return b.items.map((it, i) => {
        const col = i % c, row = Math.floor(i / c);
        const nx = r.x + pad + (col + 0.5) * cellW, ny = top + (row + 0.5) * pitch;
        return { a: nx - k * it.ox, b: ny - k * it.oy, k };
      });
    }

    function titleTarget(b, r, hot) {
      if (hot) {
        const s = Math.min(r.w / b.rest.w, r.h / b.rest.h);
        const nx = r.x + 3 * s, ny = r.y - 5 * s;
        return { a: nx - s * b.tx, b: ny - s * b.ty, k: s };
      }
      // a narrowed box shrinks its title to its width, so titles never run into each other
      const k = b.titleW > 0 ? Math.min(1, (r.w - 6) / b.titleW) : 1;
      const nx = r.x + 3, ny = r.y - 5;
      return { a: nx - k * b.tx, b: ny - k * b.ty, k };
    }

    const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const lerp = (a, b, t) => a + (b - a) * t;
    const setT = (el, t) => {
      if (Math.abs(t.k - 1) < 1e-4 && Math.abs(t.a) < 1e-3 && Math.abs(t.b) < 1e-3) el.removeAttribute('transform');
      else el.setAttribute('transform', `translate(${t.a.toFixed(3)} ${t.b.toFixed(3)}) scale(${t.k.toFixed(5)})`);
    };

    function applyLayout(hot) {
      const layout = computeLayout(hot);
      hoverMap.layout = layout;
      const jobs = [];
      for (const [n, b] of hoverMap.boxes) {
        const r = layout.get(n);
        const isHot = n === hot;
        b.group.classList.toggle('hovered', isHot);
        if (b.isCouncil) {
          b.normalLayer.classList.toggle('hidden', isHot);
          b.hoverLayer.classList.toggle('visible', isHot);
          if (b.title) b.title.classList.toggle('hidden', isHot);
          if (isHot) continue; // the council's resting layer stays where it was while it fades out
        }
        const items = placeItems(b, r, isHot);
        const title = b.title ? titleTarget(b, r, isHot) : null;
        jobs.push({ b, from: { ...b.cur }, to: r, items: b.items.map((it, i) => ({ it, from: { ...it.cur }, to: items[i] })),
          title: title ? { from: { ...b.titleCur }, to: title } : null });
      }
      const step = (t) => {
        for (const j of jobs) {
          const c = { x: lerp(j.from.x, j.to.x, t), y: lerp(j.from.y, j.to.y, t), w: lerp(j.from.w, j.to.w, t), h: lerp(j.from.h, j.to.h, t) };
          j.b.cur = c;
          if (j.b.panel) {
            j.b.panel.setAttribute('x', c.x); j.b.panel.setAttribute('y', c.y);
            j.b.panel.setAttribute('width', Math.max(0, c.w)); j.b.panel.setAttribute('height', Math.max(0, c.h));
          }
          for (const m of j.items) {
            const v = { a: lerp(m.from.a, m.to.a, t), b: lerp(m.from.b, m.to.b, t), k: lerp(m.from.k, m.to.k, t) };
            m.it.cur = v; setT(m.it.el, v);
          }
          if (j.title) {
            const v = { a: lerp(j.title.from.a, j.title.to.a, t), b: lerp(j.title.from.b, j.title.to.b, t), k: lerp(j.title.from.k, j.title.to.k, t) };
            j.b.titleCur = v; setT(j.b.title, v);
          }
        }
      };
      if (hoverMap.anim) cancelAnimationFrame(hoverMap.anim);
      if (reduceMotion.matches) { step(1); return; }
      const t0 = performance.now();
      const frame = (now) => {
        const t = Math.min(1, (now - t0) / MOVE_MS);
        step(ease(t));
        hoverMap.anim = t < 1 ? requestAnimationFrame(frame) : null;
      };
      hoverMap.anim = requestAnimationFrame(frame);
    }

    function setHot(name) {
      if (hoverMap.pending) { clearTimeout(hoverMap.pending); hoverMap.pending = null; }
      if (name === hoverMap.hot) return;
      hoverMap.hot = name;
      applyLayout(name);
    }

    // A wait already running for the same target keeps running: restarting it on every mousemove meant a
    // section opened only once the pointer stood still.
    function schedule(name, delay) {
      if (hoverMap.pending && hoverMap.pendingName === name) return;
      if (hoverMap.pending) { clearTimeout(hoverMap.pending); hoverMap.pending = null; }
      if (name === hoverMap.hot) return;
      hoverMap.pendingName = name;
      hoverMap.pending = setTimeout(() => { hoverMap.pending = null; setHot(name); }, delay);
    }

    function screenToSVG(screenX, screenY) {
      const svg = hoverMap.svg;
      if (!svg) return null;
      const svgRect = svg.getBoundingClientRect();
      const scale = Math.min(svgRect.width / 1920, svgRect.height / 1080);
      const offsetX = (svgRect.width - 1920 * scale) / 2;
      const offsetY = (svgRect.height - 1080 * scale) / 2;
      return { x: (screenX - svgRect.left - offsetX) / scale, y: (screenY - svgRect.top - offsetY) / scale };
    }

    // The box under the pointer, in the layout the map is moving to (a box's title strip above it counts)
    function boxAt(p) {
      const layout = hoverMap.layout || computeLayout(hoverMap.hot);
      for (const [n, r] of layout) {
        const top = n === hoverMap.hot ? 24 : 20;
        if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y - top && p.y <= r.y + r.h) return n;
      }
      return null;
    }

    function onMapPointer(e) {
      if (isMobile()) return;
      const p = screenToSVG(e.clientX, e.clientY);
      if (!p) return;
      const n = boxAt(p);
      if (n === hoverMap.hot) { if (hoverMap.pending) { clearTimeout(hoverMap.pending); hoverMap.pending = null; } return; }
      schedule(n, n ? HOVER_DELAY : LEAVE_DELAY);
    }

    // Initialize the map
    function init() {
      // Skip desktop interactivity on mobile
      if (isMobile()) return;

      initHoverLayout();

      // Make entire section clickable for popup (desktop only)
      document.querySelectorAll('.section-group').forEach(group => {
        group.addEventListener('click', (e) => {
          if (isMobile()) return;
          // Don't trigger if clicking on a link inside the section
          if (e.target.closest('a[href]')) return;

          const sectionName = group.getAttribute('data-section');
          if (sectionName) {
            openSectionModal(sectionName);
          }
        });
      });

      // Close modal on overlay click
      document.getElementById('modal-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'modal-overlay') {
          closeModal();
        }
      });

      // Close modal on button click
      document.getElementById('modal-close').addEventListener('click', closeModal);

      // Close modal on Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal();
        }
      });
    }

    function openSectionModal(sectionName) {
      if (isMobile()) return;

      const section = sectionData[sectionName];
      if (!section) return;

      document.getElementById('modal-title').textContent = sectionName;

      const grid = document.getElementById('modal-grid');
      grid.className = 'modal-grid';

      // Add special class for council/core orgs
      if (sectionName === 'Hedera Council' || sectionName === 'Strategic Partners' || sectionName === 'Community Partners') {
        grid.classList.add('council');
      } else if (sectionName === 'Independent Core Organizations') {
        grid.classList.add('core-orgs');
      }

      // Get all items from subcategories
      const items = Object.values(section.subcategories).flat();

      grid.innerHTML = items.map(item => {
        const logoSrc = item.logoDataUri || '';
        const hasWebsite = item.website && item.website.trim() !== '';

        // Custom size classes for specific core org logos
        let sizeClass = '';
        if (sectionName === 'Independent Core Organizations') {
          if (item.entity === 'Hedera Foundation') {
            sizeClass = ' logo-foundation';
          } else if (item.entity === 'Hedera Council') {
            sizeClass = ' logo-3x';
          }
        }

        // Repsol and FedEx logos are already white, don't invert them
        let noInvertClass = '';
        if (sectionName === 'Hedera Council' && (item.entity === 'Repsol' || item.entity === 'FedEx')) {
          noInvertClass = ' no-invert';
        }

        return `
          <a class="modal-item" ${hasWebsite ? `href="${item.website}" target="_blank" rel="noopener noreferrer"` : 'style="cursor:default;"'}>
            ${logoSrc ? `<img class="modal-item-logo${sizeClass}${noInvertClass}" src="${logoSrc}" alt="${item.entity}">` :
              `<div class="modal-item-logo${sizeClass}" style="display:flex;justify-content:center;align-items:center;font-size:20px;color:#7b59eb;font-weight:bold;">${item.entity.substring(0, 2).toUpperCase()}</div>`}
            <span class="modal-item-name">${item.entity}</span>
          </a>
        `;
      }).join('');

      document.getElementById('modal-overlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    // Search functionality
    function searchEntity(searchTerm, isMobileSearch) {
      let term = searchTerm.trim().toLowerCase();
      if (!term) return;

      // Search aliases for common alternative names
      const searchAliases = {
        // council names follow hederacouncil.org; the older names still find them
        'abrdn': 'Aberdeen',
        'aberdeen standard': 'Aberdeen',
        'aberdeen standard investments': 'Aberdeen',
        'lg electronics': 'LG',
        'nairobi securities exchange': 'NSE',
        'swirlds labs': 'Swirlds',
        'zain group': 'Zain',
        'mondelez': 'Mondelēz',
        'mondelez international': 'Mondelēz',
        'hash name service': 'HNS',
        'hashname': 'Hashgraph.Name',
        'hash names': 'Hashgraph.Name',
        'hashnames': 'Hashgraph.Name',
        'hedera name service': 'HNS',
        'hns domains': 'HNS'
      };

      // Check if the search term matches an alias
      const aliasMatch = searchAliases[term];
      if (aliasMatch) {
        term = aliasMatch.toLowerCase();
      }

      // Build list of all entities from sectionData
      const allEntities = [];
      Object.entries(sectionData).forEach(([sectionName, section]) => {
        Object.entries(section.subcategories).forEach(([subcatName, items]) => {
          items.forEach(item => {
            allEntities.push({
              entity: item.entity,
              section: sectionName,
              subcategory: subcatName,
              website: item.website
            });
          });
        });
      });

      // Find matching entity - try exact match first, then partial matching
      let match = allEntities.find(item =>
        item.entity.toLowerCase() === term
      );

      // If no exact match and term is 3+ chars, try partial matching
      if (!match && term.length >= 3) {
        // Try starts-with match (e.g., "deutsche" -> "Deutsche Telekom")
        match = allEntities.find(item =>
          item.entity.toLowerCase().startsWith(term)
        );

        // Try contains match (e.g., "telekom" -> "Deutsche Telekom")
        if (!match) {
          match = allEntities.find(item =>
            item.entity.toLowerCase().includes(term)
          );
        }
      }

      const resultElement = isMobileSearch
        ? document.getElementById('mobile-search-result')
        : document.getElementById('desktop-search-result');
      const inputElement = isMobileSearch
        ? document.getElementById('mobile-search-input')
        : document.getElementById('desktop-search-input');

      // Clear previous pulse animations
      document.querySelectorAll('.logo-pulsing').forEach(el => {
        el.classList.remove('logo-pulsing');
      });

      // Special case: check for Genfinity
      let isGenfinity = !match && (term.includes('genfinity') || 'genfinity'.includes(term));

      if (match || isGenfinity) {
        // Found
        resultElement.textContent = 'Confirmed on the Map';
        resultElement.classList.remove('not-found');
        resultElement.classList.add('visible');
        inputElement.style.visibility = 'hidden';

        // Find and pulse the logo
        if (isMobileSearch) {
          // Mobile: find the logo in mobile sections
          const mobileLogos = document.querySelectorAll('.mobile-logo');
          let foundLogo = null;

          if (isGenfinity) {
            // Find Genfinity logo in footer
            const genfinityImg = document.querySelector('.mobile-footer img[alt="Genfinity"]');
            if (genfinityImg) {
              genfinityImg.closest('.mobile-footer').scrollIntoView({ behavior: 'smooth', block: 'center' });
              genfinityImg.classList.add('logo-pulsing');
              setTimeout(() => genfinityImg.classList.remove('logo-pulsing'), 10000);
            }
          } else {
            mobileLogos.forEach(logo => {
              // First try the text name element
              const nameEl = logo.querySelector('.mobile-logo-name');
              if (nameEl && nameEl.textContent.trim().toLowerCase() === match.entity.toLowerCase()) {
                foundLogo = logo;
              }

              // For council/core-orgs, check the img alt attribute (names are hidden)
              if (!foundLogo) {
                const img = logo.querySelector('.mobile-logo-img');
                if (img && img.alt && img.alt.toLowerCase() === match.entity.toLowerCase()) {
                  foundLogo = logo;
                }
              }
            });

            if (foundLogo) {
              // For council section, scroll to the specific logo (not just the section)
              // This ensures the pulsing logo is centered on screen
              const section = foundLogo.closest('.mobile-section');
              const isCouncilSection = section && section.classList.contains('council');

              if (isCouncilSection) {
                // Scroll to the actual logo element for council
                foundLogo.scrollIntoView({ behavior: 'smooth', block: 'center' });
              } else if (section) {
                // For other sections, scroll to section
                section.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }

              // Add pulse animation to the image directly
              setTimeout(() => {
                const img = foundLogo.querySelector('.mobile-logo-img');
                if (img) {
                  img.classList.add('logo-pulsing');
                  setTimeout(() => img.classList.remove('logo-pulsing'), 10000);
                } else {
                  foundLogo.classList.add('logo-pulsing');
                  setTimeout(() => foundLogo.classList.remove('logo-pulsing'), 10000);
                }
              }, 500);
            }
          }
        } else {
          // Desktop: find the logo in SVG and activate section hover
          const svgElement = document.querySelector('.map-container svg');
          let foundImage = null;
          let foundSection = null;

          if (isGenfinity) {
            // Find Genfinity logo
            const genfinityLink = document.querySelector('a[href="https://genfinity.io"]');
            if (genfinityLink) {
              foundImage = genfinityLink.querySelector('image');
            }
          } else if (svgElement) {
            // Every logo carries its organization's name (data-entity); outside the expanded council layer first
            const byName = [...svgElement.querySelectorAll('a.map-item')].filter(a => a.getAttribute('data-entity') === match.entity && !a.closest('.council-hover'));
            const inSection = byName.find(a => a.closest('.section-group')?.getAttribute('data-section') === match.section) || byName[0];
            if (inSection) {
              foundImage = inSection.querySelector('image');
              foundSection = inSection.closest('.section-group');
            }

            // Search all logo-link elements and combine their label texts for full name match
            const allLogoLinks = svgElement.querySelectorAll('a.logo-link');

            if (!foundSection) allLogoLinks.forEach(logoLink => {
              // Get all logo-label text elements and combine them
              const labelTexts = logoLink.querySelectorAll('.logo-label');
              const fullName = Array.from(labelTexts)
                .map(t => t.textContent.trim())
                .join('')
                .toLowerCase();

              if (fullName === match.entity.toLowerCase()) {
                const image = logoLink.querySelector('image');
                if (image) {
                  foundImage = image;
                  // Find the section group containing this logo
                  foundSection = logoLink.closest('.section-group');
                }
              }
            });

            // If not found by label text, try finding by website URL (for Core Orgs which have no text labels)
            if (!foundSection && !foundImage && match.website) {
              const linkByUrl = svgElement.querySelector(`a.logo-link[href="${match.website}"]`);
              if (linkByUrl) {
                foundImage = linkByUrl.querySelector('image');
                foundSection = linkByUrl.closest('.section-group');
              }
            }
          }

          // Activate section hover state
          if (foundSection) {
            activateSectionHover(foundSection);
            // Deactivate after 10 seconds
            setTimeout(() => deactivateSectionHover(foundSection), 10000);
          }

          // For Council section, find the logo in council-hover group (not council-normal)
          if (foundSection && foundSection.classList.contains('council-section')) {
            const hoverGroup = foundSection.querySelector('.council-hover');
            if (hoverGroup) {
              const hoverLink = [...hoverGroup.querySelectorAll('a.map-item')].find(a => a.getAttribute('data-entity') === match.entity);
              if (hoverLink) {
                foundImage = hoverLink.querySelector('image');
              }
            }
          }

          // Pulse the logo
          if (foundImage) {
            foundImage.classList.add('logo-pulsing');
            setTimeout(() => foundImage.classList.remove('logo-pulsing'), 10000);
          }
        }

        // Reset after 5 seconds
        setTimeout(() => {
          resultElement.classList.remove('visible');
          inputElement.style.visibility = 'visible';
          inputElement.value = '';
        }, 5000);
      } else {
        // Not found
        resultElement.textContent = 'Not on the map yet';
        resultElement.classList.add('not-found');
        resultElement.classList.add('visible');
        inputElement.style.visibility = 'hidden';

        // Reset after 3 seconds
        setTimeout(() => {
          resultElement.classList.remove('visible', 'not-found');
          inputElement.style.visibility = 'visible';
          inputElement.value = '';
        }, 3000);
      }
    }

    // Position desktop search bar relative to SVG
    function positionDesktopSearch() {
      if (isMobile()) return;

      const container = document.getElementById('map-container');
      const searchContainer = document.getElementById('desktop-search-container');
      const svg = container ? container.querySelector('svg') : null;

      if (!svg || !searchContainer) return;

      // SVG viewBox is 1920x1080, title is at x=40, y=64 (18px font)
      // We want search bar below title, at approximately x=40, y=80 in SVG coordinates
      const svgRect = svg.getBoundingClientRect();

      // Calculate scale factor (how much the SVG is scaled from its viewBox)
      const viewBoxWidth = 1920;
      const viewBoxHeight = 1080;
      const scaleX = svgRect.width / viewBoxWidth;
      const scaleY = svgRect.height / viewBoxHeight;
      const scale = Math.min(scaleX, scaleY); // object-fit: contain uses min scale

      // Calculate offset (centering due to object-fit: contain)
      const scaledWidth = viewBoxWidth * scale;
      const scaledHeight = viewBoxHeight * scale;
      const offsetX = (svgRect.width - scaledWidth) / 2;
      const offsetY = (svgRect.height - scaledHeight) / 2;

      // Position in SVG coordinates: right edge aligned with Core Orgs section (x=1850)
      // Search bar width is 330, so left edge = 1850 - 330 = 1520
      const svgX = 1520;
      const svgY = 50;

      // Convert to screen coordinates (svgRect already includes container position)
      const screenX = svgRect.left + offsetX + (svgX * scale);
      const screenY = svgRect.top + offsetY + (svgY * scale);

      // Set search bar position
      searchContainer.style.position = 'fixed';
      searchContainer.style.left = screenX + 'px';
      searchContainer.style.top = screenY + 'px';

      // Set fixed width that scales with the map - 1.5x longer, 10% taller
      const baseWidth = 330;
      const scaledBarWidth = baseWidth * scale;

      const searchBar = searchContainer.querySelector('.search-bar');
      if (searchBar) {
        searchBar.style.width = scaledBarWidth + 'px';
        searchBar.style.height = (35 * scale) + 'px';
        searchBar.style.fontSize = (12 * scale) + 'px';
        searchBar.style.padding = `${4 * scale}px ${4 * scale}px ${4 * scale}px ${14 * scale}px`;
      }

      const searchButton = searchContainer.querySelector('.search-button');
      if (searchButton) {
        const btnSize = 24 * scale;
        searchButton.style.width = btnSize + 'px';
        searchButton.style.height = btnSize + 'px';
      }

      const searchInput = searchContainer.querySelector('.search-input');
      if (searchInput) {
        searchInput.style.fontSize = (12 * scale) + 'px';
      }
    }

    // Set up search event listeners
    function initSearch() {
      // Desktop search
      const desktopInput = document.getElementById('desktop-search-input');
      const desktopButton = document.getElementById('desktop-search-button');

      if (desktopInput && desktopButton) {
        desktopButton.addEventListener('click', () => {
          searchEntity(desktopInput.value, false);
        });
        desktopInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            searchEntity(desktopInput.value, false);
          }
        });
      }

      // Mobile search
      const mobileInput = document.getElementById('mobile-search-input');
      const mobileButton = document.getElementById('mobile-search-button');

      if (mobileInput && mobileButton) {
        mobileButton.addEventListener('click', () => {
          searchEntity(mobileInput.value, true);
        });
        mobileInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            searchEntity(mobileInput.value, true);
          }
        });
      }

      // Position desktop search bar
      positionDesktopSearch();
      window.addEventListener('resize', positionDesktopSearch);
    }

    // Search: open the found logo's section (the same zoom and reflow as hovering it)
    function activateSectionHover(sectionGroup) {
      if (!sectionGroup || !hoverMap.svg) return;
      setHot(sectionGroup.getAttribute('data-section'));
    }

    function deactivateSectionHover(sectionGroup) {
      if (!sectionGroup || !hoverMap.svg) return;
      if (hoverMap.hot === sectionGroup.getAttribute('data-section')) setHot(null);
    }

    // Update footer date to current date (so it's always fresh, not the build date)
    function updateFooterDate() {
      const dateEl = document.getElementById('footer-date');
      if (dateEl) {
        const today = new Date();
        const dateStr = today.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        dateEl.textContent = 'Data as of: ' + dateStr;
      }
    }

    // Start the app
    init();
    initSearch();
    updateFooterDate();
  </script>
</body>
