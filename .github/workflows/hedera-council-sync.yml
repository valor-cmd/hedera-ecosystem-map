# Hedera Council sync. https://hederacouncil.org is the source of truth for three sections of the map, one per tab
# on that site: Hedera Council (Council Members), Strategic Partners and Community Partners. Daily, this runs
# scripts/sync_council.mjs, which adds organizations a tab lists that the section lacks (logo downloaded from
# hederacouncil.org, the white artwork when the site has one), removes organizations a tab no longer lists, and
# replaces a logo when the site's file for it changes. When anything changed it rebuilds the site (npm run build,
# which also refreshes index.html) on the branch below and opens or updates a pull request; nothing is pushed to
# main, so nothing goes live until the pull request is merged. If the site cannot be fetched or parsed the job
# fails (and GitHub sends its failed-run email) rather than reporting "no changes".
# Uses only GITHUB_TOKEN. Opening pull requests with it needs "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General > Workflow permissions).
name: hedera-council-sync
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: hedera-council-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: hedera-council-sync
      REPORT: council-report.json # workspace root; only the data paths below are committed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync from hederacouncil.org
        run: node scripts/sync_council.mjs --report "$REPORT"
      - name: Detect changes
        id: diff
        run: |
          git add -A data/hedera_ecosystem_master.csv logos/council scripts/council-state.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build the site
        if: steps.diff.outputs.changed == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run build
          git add -A data logos scripts/council-state.json dist index.html
      - name: Write pull request text
        if: steps.diff.outputs.changed == 'true'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const r = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"));
            const secs = Object.entries(r.sections);
            const count = (k) => secs.reduce((t, [, s]) => t + s[k].length, 0);
            const parts = [];
            const n = count("added"), d = count("removed"), l = count("logoChanged");
            if (n) parts.push(`${n} added`);
            if (d) parts.push(`${d} removed`);
            if (l) parts.push(`${l} logo change${l === 1 ? "" : "s"}`);
            const title = `Hedera Council sync: ${parts.join(", ") || "baseline refresh"}`;
            const lines = [`Automated sync of the Hedera Council, Strategic Partners and Community Partners sections from https://hederacouncil.org (${r.method}).`, ""];
            for (const [name, s] of secs) {
              lines.push(`### ${name} (hederacouncil.org tab: ${s.tab}, ${s.siteCount} listed)`);
              if (!s.added.length && !s.removed.length && !s.logoChanged.length && !(s.renamed ?? []).length) { lines.push("No change.", ""); continue; }
              for (const a of s.added) lines.push(`- Added ${a.name}: logo ${a.logo}${a.website ? `, website ${a.website}` : ". hederacouncil.org does not publish a website, please add one in the CSV"}`);
              for (const x of s.removed) lines.push(`- Removed ${x}: no longer listed on this tab`);
              for (const x of s.renamed ?? []) lines.push(`- Renamed ${x.from} to ${x.to}, the spelling on hederacouncil.org`);
              for (const c of s.logoChanged) lines.push(`- New logo for ${c.name}: ${c.from} replaced by ${c.to}`);
              lines.push("");
            }
            for (const note of r.notes ?? []) lines.push(`Note: ${note}`);
            lines.push("", "Rebuilt with npm run build (index.html included). Merging this pull request publishes it on hederamap.com.", "Generated by .github/workflows/hedera-council-sync.yml (scripts/sync_council.mjs).");
            fs.writeFileSync("pr-title.txt", title);
            fs.writeFileSync("pr-body.md", lines.join("\n") + "\n");
          '
          cat pr-title.txt; echo; cat pr-body.md
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q -m "$(cat pr-title.txt)" -m "Source: https://hederacouncil.org"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$(cat pr-title.txt)" --body-file pr-body.md
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "$(cat pr-title.txt)" --body-file pr-body.md
          fi
